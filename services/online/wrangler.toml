# The Worker of Itinero's online side (docs/spec/access/accounts.md §2, §5).
name = "itinero"
main = "src/index.ts"
compatibility_date = "2026-10-28"

# Once a day: forget sessions past their 180 days and nonces past their 10 minutes
# (docs/spec/access/accounts.md §5).
[triggers]
crons = ["0 3 * * *"]

[vars]
# Itinero's client identifier at Google, which is public (docs/spec/access/accounts.md §5).
# Replace it with the identifier Google gives once Itinero is registered there.
GOOGLE_CLIENT_ID = "not-registered-yet.apps.googleusercontent.com"
# The address invitations are sent from, at a domain Resend has checked
# (docs/spec/access/membership.md §3.4). Replace it once Itinero's domain is set up at Resend.
INVITATIONS_FROM = "Itinero <invitations@itinero.invalid>"

# Accounts and membership, in one D1 database (ADR-0015). Replace database_id with the
# identifier `wrangler d1 create itinero` gives, before the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "itinero"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# NONCE_KEY and RESEND_API_KEY are secrets, set with `wrangler secret put`, never in the repository.
# For `wrangler dev`, put it in .dev.vars, which git ignores.
