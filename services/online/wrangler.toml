# The Worker of Itinero's online side (docs/spec/access/accounts.md §2, §5).
name = "itinero"
main = "src/index.ts"
compatibility_date = "2026-10-28"

# The web app, served as the Worker's static files (docs/spec/web/shell.md §4.6, ADR-0018). Every
# path under /api/ goes to the Worker. Any other path names a file of the web app, or is a screen's
# address, which gets index.html. Build the web app first, with `npm run build` in apps/web/.
[assets]
directory = "../../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Once a day: forget sessions past their 180 days and nonces past their 10 minutes
# (docs/spec/access/accounts.md §5).
# Itinero's own domain, served by the Worker as a custom domain of its Cloudflare zone.
[[routes]]
pattern = "useitinero.ca"
custom_domain = true

[triggers]
crons = ["0 3 * * *"]

[vars]
# Itinero's client identifier at Google, which is public (docs/spec/access/accounts.md §5).
GOOGLE_CLIENT_ID = "221784151775-636kuilrnk6vkk71mbbbkbg0f09i5bd5.apps.googleusercontent.com"
# The address invitations are sent from, at a domain Resend has checked
# (docs/spec/access/membership.md §3.4).
INVITATIONS_FROM = "Itinero <invitations@useitinero.ca>"

# Accounts and membership, in one D1 database (ADR-0015). database_id is the identifier
# `wrangler d1 create itinero` gave the online side's database.
[[d1_databases]]
binding = "DB"
database_name = "itinero"
database_id = "682789ab-16c7-4b79-a411-87c257eadad2"
migrations_dir = "migrations"

# Each trip, in a Durable Object of its own with its own SQLite database
# (docs/spec/planner/trip-host.md §3.4, §5).
[[durable_objects.bindings]]
name = "TRIPS"
class_name = "TripHost"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripHost"]

# NONCE_KEY and RESEND_API_KEY are secrets, set with `wrangler secret put`, never in the repository.
# For `wrangler dev`, put it in .dev.vars, which git ignores.
