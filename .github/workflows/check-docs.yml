# Holds every document in docs/ to the documentation system (docs/spec/shared/doc-check.md §3.4).
name: check-docs

# Runs on each pull request, and each push to main (ADR-0023). A push to another branch is checked
# through its pull request, so each push to a pull request starts one run, not two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup, preinstalled on the runner, installs the toolchain rust-toolchain.toml pins.
      - name: Show the pinned toolchain
        run: rustc --version

      - uses: extractions/setup-just@v4

      - name: Test doc-check
        run: just test-docs

      - name: Check the vault
        run: just check-docs --summary "$GITHUB_STEP_SUMMARY"
